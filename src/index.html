<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="icon" href="./favicon.ico" />
    <link href="./css/entry-button.css" rel="stylesheet">
    <link href="./css/index.css" rel="stylesheet">
</head>
<body>
<div class="game" id="root">
    <div id="custom-cursor" class="custom-cursor">
        <div id="cursor-middle" class="cursor-layer"></div>
        <div id="cursor" class="cursor-layer"></div>
    </div>
    <button id="enter" class="pink-button">
        <span class="button-text">Start</span>
        <span class="button-hover"></span>
    </button>
    <div class="description">
        <div>请先手动进入浏览器全屏模式获得更好的体验</div>
        <div>Please manually switch your browser to full-screen mode first for the best experience.</div>
    </div>
    <div id="stage-container" class="stage-container">
        <canvas id="stage"></canvas>
    </div>
</div>
<script src="./js/index.js" type="module"></script>
</body>
</html>
